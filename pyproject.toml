[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beatex"
version = "0.1.0"
description = "Extract the best-possible beatmap (the hit timings a human would feel) from any song, by reusing Mapperatorinator's pretrained osu! timing model."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yevhen" }]
keywords = ["beatmap", "rhythm", "osu", "music", "onset", "timing", "games"]
dependencies = []

[project.optional-dependencies]
app = ["streamlit>=1.40", "pandas>=2.0", "numpy>=1.26", "pydub>=0.25"]
tools = ["numpy>=1.26", "pydub>=0.25"]

[project.scripts]
beatex = "beatex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["beatex"]
